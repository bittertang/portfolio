<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a hard refresh or a
      // direct link to a route like /work/flowline 404s. This is the
      // well-established workaround (see rafgraph/spa-github-pages): GitHub
      // serves this file for any unknown path, and it re-encodes the path
      // into a query string, then index.html's inline script below decodes
      // it and hands the real URL to React Router.
      //
      // pathSegmentsToKeep: 0 for a custom domain or a username.github.io
      // root site. Set to 1 if you deploy to a project subpath instead
      // (e.g. username.github.io/repo-name) WITHOUT a custom domain — and
      // update vite.config.js's `base` to match (see README).
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
